name: Aster deterministic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/Scripts/python -m pip install -r backend/requirements.lock -r tests/requirements-qa.txt
      - run: npm --prefix frontend ci
      - run: .venv/Scripts/ruff check backend tests
      - run: .venv/Scripts/python -m pytest -q
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run test:unit
      - run: .venv/Scripts/python -m tests.scan_credentials
      - run: npm --prefix frontend test
